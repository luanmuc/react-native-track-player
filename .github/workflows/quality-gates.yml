name: quality-gates

# 2026-11-20 新增：本仓的四个门禁此前只在本地跑，CI 只做三平台 build 验证，
# 改坏 java 或删断言都能绿着推上去。这里把本地判据原样搬进 CI。
on: [push, pull_request]
concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 跨仓断言需要 App 侧 package.json（FORK_NOTES 的「App 锁定 sha」必须与之相等）
      - name: Checkout App Repo（公开仓，只读）
        uses: actions/checkout@v4
        with:
          repository: luanmuc/mobile-app
          path: .app
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 音频焦点策略断言（67 条，javac + 场景 runner）
        run: node scripts/check_audio_focus_policy.js

      - name: Java 语法全量（18 文件 / 4,204 行）
        run: node scripts/check-java-syntax.js

      - name: 口径门禁（G1 队列 ID / G2 裸数字 / G3 AGP / G4 postDelayed 常量）
        run: node scripts/check_truth_gates.js

      - name: 文档巡检（图标张数 / 锁定 sha / PLAYER_CONTROL / 定制符号）
        run: node scripts/docs-audit.js
        env:
          LX_APP_ROOT: ${{ github.workspace }}/.app
