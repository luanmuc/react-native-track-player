name: platform-validation

# 2026-11-21 重整：
# 原文件三个 example 构建在新 runner 上已结构性失效——
#   ① build-ios 的 Node 12.18.3 在 darwin-arm64 无对应构建（"Unable to find Node version"）；
#   ② 三方 c-hive/gha-yarn-cache@v1 内部走的 cache API 常年 503（"Our services aren't available"）；
#   ③ actions/cache@v2 已被 GitHub 强制禁用。
# 现在：push 只做「库能否构建」（快、不与 quality-gates 重复），三平台 example 构建改为手动触发。
on:
  push:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src/**'
      - 'lib/**'
      - 'package.json'
      - '*.podspec'
      - 'index.js'
      - '.github/workflows/platform-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Yarn
        run: npm install --global yarn
      - name: Install Library Dependencies
        run: yarn install
      - name: Build Library
        run: yarn build

  # 以下三个 example 构建仅手动触发：它们验证的是「上游 example 工程能否编译」，
  # 与本 fork 的质量判据无关，且在 arm64 macOS runner 上需要重新对齐 RN 版本。
  example-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --global yarn
      - run: yarn install
      - run: yarn build
      - name: Install Mobile Dependencies
        run: |-
          cd example
          yarn install
      - name: Build App
        run: |-
          cd example/android
          ./gradlew assembleDebug --no-daemon

  example-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --global yarn
      - run: yarn install
      - run: yarn build
      - name: Install Mobile Dependencies
        run: |-
          cd example
          yarn install
      - name: Build App
        run: |-
          cd example/ios
          xcodebuild build -workspace example.xcworkspace -scheme example -destination 'platform=iOS Simulator,name=iPhone 15'

  example-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --global yarn
      - run: yarn install
      - run: yarn build
      - name: Install Windows Example Dependencies
        run: |-
          cd example
          yarn install
      - name: Build App
        run: |-
          cd example
          yarn windows --no-deploy --no-launch --no-packager --logging
